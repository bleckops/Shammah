name: Android CI

on:
  push:
    branches:
      - dev
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firebase-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: Dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > androidApp/google-services.json

      - name: Set version
        run: |
          VERSION_NAME=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)
          VERSION_CODE_BASE=$(grep '^VERSION_CODE_BASE=' version.properties | cut -d= -f2)
          echo "VERSION=${VERSION_NAME}-dev.${{ github.run_number }}" >> $GITHUB_ENV
          echo "VERSION_CODE=$((VERSION_CODE_BASE + ${{ github.run_number }}))" >> $GITHUB_ENV

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Create Firebase credentials
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > firebase.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - run: chmod +x gradlew

      # Host unit tests for KMP modules (avoid iOS/wasm browser test targets on Linux CI).
      - run: |
          ./gradlew \
            :composeApp:testAndroidHostTest \
            :core-data:testAndroidHostTest \
            :core-domain:testAndroidHostTest \
            :core-ui:testAndroidHostTest \
            :feature-auth:testAndroidHostTest \
            :feature-events:testAndroidHostTest \
            :feature-home:testAndroidHostTest \
            :feature-resources:testAndroidHostTest \
            :feature-sermons:testAndroidHostTest \
            :test-support:testAndroidHostTest \
            :androidApp:assembleRelease
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Fastlane Firebase
        run: bundle exec fastlane firebase
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: firebase.json

  play-internal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > androidApp/google-services.json

      - name: Set version
        run: |
          VERSION_NAME=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)
          VERSION_CODE_BASE=$(grep '^VERSION_CODE_BASE=' version.properties | cut -d= -f2)
          echo "VERSION=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=$((VERSION_CODE_BASE + ${{ github.run_number }}))" >> $GITHUB_ENV

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Create Play credentials
        run: printf '%s' "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > play-store.json
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}

      - run: chmod +x gradlew

      - run: |
          ./gradlew \
            :composeApp:testAndroidHostTest \
            :core-data:testAndroidHostTest \
            :core-domain:testAndroidHostTest \
            :core-ui:testAndroidHostTest \
            :feature-auth:testAndroidHostTest \
            :feature-events:testAndroidHostTest \
            :feature-home:testAndroidHostTest \
            :feature-resources:testAndroidHostTest \
            :feature-sermons:testAndroidHostTest \
            :test-support:testAndroidHostTest \
            :androidApp:lintRelease \
            :androidApp:bundleRelease
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Fastlane Play internal
        run: bundle exec fastlane play_upload
        env:
          PLAY_TRACK: internal

  production:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: Dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > androidApp/google-services.json

      - name: Set version from tag
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NAME="${VERSION#v}"
          VERSION_CODE_BASE=$(grep '^VERSION_CODE_BASE=' version.properties | cut -d= -f2)
          echo "VERSION=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=$((VERSION_CODE_BASE + ${{ github.run_number }}))" >> $GITHUB_ENV

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Create Play credentials
        run: printf '%s' "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > play-store.json
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}

      - run: chmod +x gradlew

      - run: |
          ./gradlew \
            :composeApp:testAndroidHostTest \
            :core-data:testAndroidHostTest \
            :core-domain:testAndroidHostTest \
            :core-ui:testAndroidHostTest \
            :feature-auth:testAndroidHostTest \
            :feature-events:testAndroidHostTest \
            :feature-home:testAndroidHostTest \
            :feature-resources:testAndroidHostTest \
            :feature-sermons:testAndroidHostTest \
            :test-support:testAndroidHostTest \
            :androidApp:lintRelease \
            :androidApp:bundleRelease
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Fastlane Play production
        run: bundle exec fastlane play_upload
        env:
          PLAY_TRACK: production
